<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>患者与预约 · 蓉易口腔诊所</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="patients">
<div class="layout">

  <!-- ===== 侧边导航（9 顶级菜单） ===== -->
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="logo"></span>蓉易口腔诊所</div>
    <div class="sidebar-group">常用</div>
    <a class="nav-item" data-nav="dashboard" href="dashboard.html">工作台</a>
    <a class="nav-item" data-nav="patients" href="patients.html">患者与预约</a>
    <a class="nav-item" data-nav="treatment-plan" href="treatment-plan.html">临床记录</a>
    <a class="nav-item" data-nav="billing" href="billing.html">财务中心</a>
    <a class="nav-item" href="#">库存与采购</a>
    <div class="sidebar-group">更多</div>
    <a class="nav-item" href="#">经营分析</a>
    <a class="nav-item" href="#">随访与沟通</a>
    <a class="nav-item" href="#">人事与设备</a>
    <a class="nav-item" href="#">系统管理</a>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0;">

    <!-- ===== 顶栏 ===== -->
    <header class="topbar">
      <div>
        <div class="topbar-title">患者与预约</div>
        <div class="topbar-sub">患者档案 · 预约管理 · 就诊记录</div>
      </div>
      <input class="topbar-search" type="search" placeholder="搜索患者 / 项目 / 单号…">
      <div class="topbar-user" style="margin-left:auto;"><span class="avatar"></span>前台 · 王丽</div>
    </header>

    <main class="content">

      <!-- ===== 工具行 ===== -->
      <div class="page-head">
        <div>
          <div class="page-title">患者列表</div>
          <div class="page-sub">共 6 位患者 · 数据为演示假数据</div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <input type="search" class="topbar-search" style="width:280px;" placeholder="搜索姓名 / 手机号…">
          <select style="height:32px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface);outline:none;">
            <option>全部性别</option><option>男</option><option>女</option>
          </select>
          <select style="height:32px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface);outline:none;">
            <option>全部来源</option><option>到店</option><option>线上</option><option>转介绍</option><option>老客户</option>
          </select>
          <button class="btn btn-primary" data-open-modal="#modal-patient">+ 新建患者</button>
        </div>
      </div>

      <!-- ===== 患者表格 ===== -->
      <div class="card" style="padding:0;overflow:hidden;">
        <table class="table" id="patient-table">
          <thead>
            <tr><th>姓名</th><th>性别</th><th>年龄</th><th>手机</th><th>最近就诊</th><th>累计消费</th><th>来源</th><th>状态</th><th style="width:120px;">操作</th></tr>
          </thead>
          <tbody id="patient-tbody"></tbody>
        </table>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border);">
          <span style="font-size:11.5px;color:var(--muted);">第 1-6 条，共 6 条</span>
          <div class="pagination">
            <button class="page-btn" disabled>上一页</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <button class="page-btn">下一页</button>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- ===== 新建患者弹窗 ===== -->
<div class="modal-mask" id="modal-patient">
  <div class="modal">
    <div class="modal-head"><h3>新建患者</h3><button class="btn btn-text" data-close-modal="modal-patient">✕</button></div>
    <form id="patient-form" class="modal-body" style="display:block;" novalidate>
      <div class="form-grid">
        <div class="field" id="f-name"><label>姓名 <span class="req">*</span></label><input id="p-name" required><div class="field-error">请输入患者姓名</div></div>
        <div class="field"><label>性别</label><select><option>女</option><option>男</option></select></div>
        <div class="field"><label>年龄</label><input type="number" min="0" max="120" placeholder="如：35"></div>
        <div class="field" id="f-phone"><label>手机号 <span class="req">*</span></label><input id="p-phone" required><div class="field-error">请输入正确的 11 位手机号</div></div>
        <div class="field"><label>身份证号</label><input placeholder="选填"></div>
        <div class="field"><label>来源</label><select><option>到店</option><option>线上</option><option>转介绍</option><option>老客户</option></select></div>
        <div class="field full"><label>备注</label><textarea placeholder="过敏史、既往史等补充信息"></textarea></div>
      </div>
    </form>
    <div class="modal-foot">
      <button class="btn btn-secondary" data-close-modal="modal-patient">取消</button>
      <button class="btn btn-primary" id="patient-save">保存</button>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
/* 患者表格渲染 */
(function () {
  const STATUS = { '治疗中': 'badge-active', '已完成': 'badge-success', '待就诊': 'badge-info' };
  const tbody = document.getElementById('patient-tbody');
  DATA.patients.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td style="font-weight:600;">' + p.name + '</td>' +
      '<td>' + p.gender + '</td>' +
      '<td>' + p.age + '</td>' +
      '<td class="num">' + p.phone + '</td>' +
      '<td class="num">' + p.lastVisit + '</td>' +
      '<td class="num">¥' + p.total.toLocaleString() + '</td>' +
      '<td>' + p.source + '</td>' +
      '<td><span class="badge ' + STATUS[p.status] + '">' + p.status + '</span></td>' +
      '<td class="actions"><button class="btn btn-text">编辑</button><button class="btn btn-text danger" data-confirm="确定删除该患者吗？">删除</button></td>';
    tbody.appendChild(tr);
  });

  /* 新建患者：校验 → toast + 关闭 + 追加一行 */
  function setError(field, on) {
    field.classList.toggle('has-error', on);
  }
  document.getElementById('patient-save').addEventListener('click', () => {
    const name = document.getElementById('p-name').value.trim();
    const phone = document.getElementById('p-phone').value.trim();
    const nameOk = name.length > 0;
    const phoneOk = /^1\d{10}$/.test(phone);
    setError(document.getElementById('f-name'), !nameOk);
    setError(document.getElementById('f-phone'), !phoneOk);
    if (!nameOk || !phoneOk) return;
    showToast('患者已创建（原型演示）');
    closeModal('modal-patient');
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td style="font-weight:600;">' + name + '</td>' +
      '<td>—</td><td>—</td>' +
      '<td class="num">' + phone.slice(0, 3) + '****' + phone.slice(7) + '</td>' +
      '<td class="num">—</td><td class="num">¥0</td><td>到店</td>' +
      '<td><span class="badge badge-info">待就诊</span></td>' +
      '<td class="actions"><button class="btn btn-text">编辑</button><button class="btn btn-text danger" data-confirm="确定删除该患者吗？">删除</button></td>';
    tbody.appendChild(tr);
  });
})();
</script>
</body>
</html>
