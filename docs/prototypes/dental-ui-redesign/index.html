<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贝易口腔诊所 · 界面改版原型</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/lucide@0.542.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <!-- 登录页 -->
    <div id="login-view" class="login-view">
      <div class="login-brand">
        <div class="brand-mark">
          <i data-lucide="sparkles"></i>
        </div>
        <div>
          <h1>贝易口腔</h1>
          <p>诊所经营工作台 · 设计预览版</p>
        </div>
      </div>
      <div class="login-card">
        <div class="login-card-head">
          <span class="eyebrow">WELCOME BACK</span>
          <h2>登录工作台</h2>
          <p>使用演示账号 admin 进入（任意密码即可）</p>
        </div>
        <form id="login-form">
          <label>
            <span>账号</span>
            <div class="input-wrap">
              <i data-lucide="user"></i>
              <input value="admin" autocomplete="username" />
            </div>
          </label>
          <label>
            <span>密码</span>
            <div class="input-wrap">
              <i data-lucide="lock"></i>
              <input type="password" value="" autocomplete="current-password" />
            </div>
          </label>
          <div class="login-row">
            <label class="check">
              <input type="checkbox" checked />
              <span>记住我</span>
            </label>
            <a href="#">忘记密码？</a>
          </div>
          <button class="btn-primary btn-block" type="submit">
            进入工作台
            <i data-lucide="arrow-right"></i>
          </button>
        </form>
        <div class="login-foot">
          内部预览版 · 不收集任何真实患者数据
        </div>
      </div>
    </div>

    <!-- 应用主框架 -->
    <div id="app-shell" class="app-shell hidden">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark small">
            <i data-lucide="sparkles"></i>
          </div>
          <div>
            <strong>贝易口腔</strong>
            <span>Clinic OS</span>
          </div>
        </div>
        <div class="sidebar-section-label">日常运营</div>
        <nav class="sidebar-nav">
          <button class="nav-item active" data-page="dashboard">
            <i data-lucide="layout-dashboard"></i><span>工作台</span>
          </button>
          <button class="nav-item" data-page="patients">
            <i data-lucide="users"></i><span>患者管理</span>
          </button>
          <button class="nav-item" data-page="schedule">
            <i data-lucide="calendar-days"></i><span>预约排班</span>
          </button>
          <button class="nav-item" data-page="clinical">
            <i data-lucide="stethoscope"></i><span>临床工作台</span>
          </button>
          <button class="nav-item" data-page="charges">
            <i data-lucide="receipt-text"></i><span>收费管理</span>
          </button>
          <button class="nav-item" data-page="components">
            <i data-lucide="blocks"></i><span>组件库</span>
          </button>
        </nav>
        <div class="sidebar-section-label">系统</div>
        <nav class="sidebar-nav">
          <button class="nav-item">
            <i data-lucide="settings"></i><span>系统设置</span>
          </button>
        </nav>
        <div class="sidebar-card">
          <div class="sidebar-card-icon"><i data-lucide="cloud"></i></div>
          <strong>数据已同步</strong>
          <span>上次备份 10 分钟前</span>
          <button class="btn-ghost-dark">立即备份</button>
        </div>
        <div class="sidebar-user">
          <div class="avatar">管</div>
          <div>
            <strong>管理员</strong>
            <span>BOSS</span>
          </div>
          <i data-lucide="log-out"></i>
        </div>
      </aside>

      <div class="main-shell">
        <header class="topbar">
          <div class="topbar-left">
            <button id="sidebar-toggle" class="icon-btn" aria-label="收起侧栏">
              <i data-lucide="panel-left"></i>
            </button>
            <div>
              <span class="page-crumb" id="page-crumb">日常运营</span>
              <h2 id="page-title">工作台</h2>
            </div>
          </div>
          <div class="topbar-right">
            <div class="global-search">
              <i data-lucide="search"></i>
              <input placeholder="搜索患者 / 预约 / 收费单..." />
              <kbd>⌘ K</kbd>
            </div>
            <button class="icon-btn" aria-label="通知">
              <i data-lucide="bell"></i>
              <span class="dot"></span>
            </button>
            <button class="icon-btn" aria-label="帮助">
              <i data-lucide="circle-help"></i>
            </button>
            <div class="topbar-avatar">管</div>
          </div>
        </header>

        <main id="page-container" class="page-container"></main>
      </div>
    </div>

    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <!-- 通用弹窗 -->
    <div id="modal" class="modal hidden">
      <div class="modal-mask" data-close-modal></div>
      <div class="modal-card">
        <div class="modal-head">
          <h3 id="modal-title">新建患者</h3>
          <button class="icon-btn" data-close-modal aria-label="关闭">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
