<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>治疗计划 · 蓉易口腔诊所</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="treatment-plan">
<div class="layout">

  <!-- ===== 侧边导航（9 顶级菜单） ===== -->
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="logo"></span>蓉易口腔诊所</div>
    <div class="sidebar-group">常用</div>
    <a class="nav-item" data-nav="dashboard" href="dashboard.html">工作台</a>
    <a class="nav-item" data-nav="patients" href="patients.html">患者与预约</a>
    <a class="nav-item" data-nav="treatment-plan" href="treatment-plan.html">临床记录</a>
    <a class="nav-item" data-nav="billing" href="billing.html">财务中心</a>
    <a class="nav-item" href="#">库存与采购</a>
    <div class="sidebar-group">更多</div>
    <a class="nav-item" href="#">经营分析</a>
    <a class="nav-item" href="#">随访与沟通</a>
    <a class="nav-item" href="#">人事与设备</a>
    <a class="nav-item" href="#">系统管理</a>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0;">

    <!-- ===== 顶栏 ===== -->
    <header class="topbar">
      <div>
        <div class="topbar-title">治疗计划</div>
        <div class="topbar-sub">临床记录 · 方案明细 · 收费发起</div>
      </div>
      <input class="topbar-search" type="search" placeholder="搜索患者 / 项目 / 单号…">
      <div class="topbar-user" style="margin-left:auto;"><span class="avatar"></span>前台 · 王丽</div>
    </header>

    <main class="content">

      <div class="plan-layout">

        <!-- ===== 左：计划明细表 ===== -->
        <div class="card plan-table-card">
          <div class="card-head">
            <h3>治疗计划明细</h3>
            <span class="badge badge-active">治疗中</span>
          </div>
          <table class="table">
            <thead><tr><th style="width:60px;">牙位</th><th>项目</th><th>材料</th><th style="width:90px;">单价</th><th style="width:60px;">数量</th><th style="width:100px;text-align:right;">金额</th><th style="width:80px;">状态</th><th style="width:70px;text-align:right;">操作</th></tr></thead>
            <tbody id="plan-tbody"></tbody>
          </table>
          <div class="plan-footer">
            <div><span class="total-label">合计（含材料费）</span><span style="margin-left:12px;" class="total" id="plan-total">¥9,920</span></div>
            <div class="actions">
              <button class="btn btn-secondary" id="add-row">+ 添加明细</button>
              <button class="btn btn-primary" id="save-plan">保存计划</button>
              <button class="btn btn-primary" id="charge-plan">发起收费</button>
            </div>
          </div>
        </div>

        <!-- ===== 右：患者信息卡 ===== -->
        <div class="card plan-side">
          <h3>患者信息</h3>
          <div class="side-row"><span class="k">姓名</span><span style="font-weight:600;">张丽华</span></div>
          <div class="side-row"><span class="k">性别 / 年龄</span><span>女 · 38 岁</span></div>
          <div class="side-row"><span class="k">档案编号</span><span class="num">P001</span></div>
          <div class="side-row"><span class="k">主治医生</span><span>王建国 · 主任医师</span></div>
          <div class="side-row"><span class="k">计划日期</span><span class="num">2026-08-06</span></div>
          <div class="side-row"><span class="k">过敏史</span><span>无</span></div>
          <div style="margin-top:14px;">
            <span class="badge badge-active">治疗中</span>
            <span class="badge badge-info" style="margin-left:6px;">第 2 阶段</span>
          </div>
        </div>

      </div>

    </main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
/* 治疗计划：明细渲染、增删行、合计重算 */
(function () {
  const tbody = document.getElementById('plan-tbody');
  const totalEl = document.getElementById('plan-total');
  const BASE_TOTAL = 9920; // DATA.planRows 静态合计（规格数据）

  function fmt(n) { return '¥' + n.toLocaleString('zh-CN'); }
  function recalc() {
    let sum = BASE_TOTAL;
    tbody.querySelectorAll('tr[data-added]').forEach(tr => {
      const price = parseFloat(tr.querySelector('.c-price').value) || 0;
      const qty = parseFloat(tr.querySelector('.c-qty').value) || 0;
      tr.querySelector('.c-amt').textContent = fmt(price * qty);
      sum += price * qty;
    });
    totalEl.textContent = fmt(sum);
  }

  /* 静态行（来自 DATA.planRows） */
  DATA.planRows.forEach(r => {
    const tr = document.createElement('tr');
    const badge = r.status === 'done'
      ? '<span class="badge badge-success">已完成</span>'
      : '<span class="badge badge-info">待执行</span>';
    tr.innerHTML =
      '<td class="num">' + r.tooth + '</td>' +
      '<td>' + r.item + '</td>' +
      '<td>' + r.material + '</td>' +
      '<td class="num">' + fmt(r.price) + '</td>' +
      '<td class="num">' + r.qty + '</td>' +
      '<td class="num" style="text-align:right;">' + fmt(r.price * r.qty) + '</td>' +
      '<td>' + badge + '</td>' +
      '<td class="del-cell"><button class="btn btn-text danger">删除</button></td>';
    tr.querySelector('.btn-text').addEventListener('click', () => {
      showConfirm('删除明细', '确定删除「' + r.item + '」这条明细吗？', () => {
        tr.remove();
        showToast('明细已删除（原型演示）');
      });
    });
    tbody.appendChild(tr);
  });

  /* 添加明细：追加可编辑行 */
  document.getElementById('add-row').addEventListener('click', () => {
    const tr = document.createElement('tr');
    tr.dataset.added = '1';
    tr.innerHTML =
      '<td><input class="cell-input c-tooth" placeholder="如 26"></td>' +
      '<td><input class="cell-input c-item" placeholder="项目名称"></td>' +
      '<td><input class="cell-input c-mat" placeholder="材料/备注"></td>' +
      '<td><input class="cell-input c-price num" type="number" placeholder="0"></td>' +
      '<td><input class="cell-input c-qty num" type="number" value="1"></td>' +
      '<td class="num" style="text-align:right;"><span class="c-amt">¥0</span></td>' +
      '<td><span class="badge badge-info">待执行</span></td>' +
      '<td class="del-cell"><button class="btn btn-text danger">删除</button></td>';
    tr.querySelector('.btn-text').addEventListener('click', () => {
      showConfirm('删除明细', '确定删除这条明细吗？', () => { tr.remove(); recalc(); });
    });
    tr.addEventListener('input', recalc);
    tbody.appendChild(tr);
    recalc();
  });

  /* 保存 / 发起收费 */
  document.getElementById('save-plan').addEventListener('click', () => showToast('计划已保存（原型演示）'));
  document.getElementById('charge-plan').addEventListener('click', () => {
    showConfirm('发起收费', '向 张丽华 发起 ' + totalEl.textContent + ' 的收费？', () => showToast('已发起收费（原型演示）'));
  });
})();
</script>
</body>
</html>
