<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 静态错误页无内联脚本：消息与按钮经主进程 executeJavaScript（DevTools 协议，不受 CSP 约束）
     注入且 payload 已 JSON.stringify 转义；style 内联仅为本页布局，允许 unsafe-inline。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>Dental Clinic V2 - 服务异常</title>
<style>
  body { font-family: 'Microsoft YaHei', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #1e1e1e; color: #eee; }
  .box { max-width: 560px; padding: 32px; background: #2a2a2a; border-radius: 12px; }
  h1 { font-size: 20px; }
  pre { white-space: pre-wrap; font-size: 13px; color: #bbb; }
  button { margin-top: 16px; padding: 8px 20px; font-size: 14px; border-radius: 6px; border: 0; background: #3b82f6; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <h1>本地服务启动失败</h1>
  <pre id="msg">正在加载错误信息…</pre>
  <button id="retry">重试启动</button>
  <button id="quit">退出应用</button>
</div>
</body>
</html>
