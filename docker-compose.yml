services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dental-clinic-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATA_DIR=/app/data
      - CORS_ORIGIN=http://localhost:3000,http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-random-32-char-string}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-to-a-random-64-char-hex-string}
      - JWT_EXPIRES_IN=7d
      - BCRYPT_ROUNDS=12
      - TRUST_PROXY=1
    volumes:
      - dental-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const options = {hostname: 'localhost', port: process.env.PORT || 8080, path: '/api/v1/health', method: 'GET', timeout: 5000}; const req = http.request(options, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  dental-data:
    name: dental-clinic-data
