packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  '@electron/get': '^3.1.0'
allowBuilds:
  '@scarf/scarf': set this to true or false
  better-sqlite3: set this to true or false
  electron-winstaller: set this to true or false
  esbuild: true
  unrs-resolver: set this to true or false
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.101.4'
  - '@tanstack/react-query@5.101.4'
  - better-sqlite3@13.0.1
  - electron@43.2.0
  - postcss@8.5.21
  - react-dom@19.2.8
  - react@19.2.8
