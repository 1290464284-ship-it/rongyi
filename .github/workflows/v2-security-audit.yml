name: V2 Security Audit

on:
  schedule:
    # 每周一 03:00 UTC 定期漏洞扫描（审计 P2-2：此前全部依赖检查仅随 push/PR 触发）
    - cron: '0 3 * * 1'
  workflow_dispatch:

# 只读权限，仅上传 SBOM artifact。
permissions:
  contents: read

jobs:
  audit:
    name: Dependency & Source Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24 runtime)

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=high

      - name: osv-scanner lockfile scan
        # B-1.4 首跑修复：npm 上不存在 osv-scanner 包（E404）。改用官方
        # action 并 pin 到 v2.5.0 的完整 commit SHA。
        uses: google/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

      - name: Source security scan
        run: pnpm --filter @dental/v2 security:scan

      - name: License check
        run: pnpm --filter @dental/v2 run license:check

      - name: Generate full SBOM
        run: pnpm --filter @dental/v2 run sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: apps/v2/sbom.cdx.json
          if-no-files-found: error
