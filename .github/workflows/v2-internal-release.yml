name: V2 Internal Release

# Round7 H4：本 workflow 是手动内部发布通道（workflow_dispatch 专用），
# 截至 Round7 审计从未在 Actions runner 上运行过（v2-internal-2.1.4 是早期
# 手工产物）。首次触发前需确认：C1（legacy/dental.sqlite 已随仓库恢复）、
# C2（package.json 版本与 inputs.version 一致，本 job 会强制校验）。
# 内部版使用临时自签名证书打包（build-internal-installer.ps1），仅供
# 受控环境分发，不对外发布。
on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected version tag suffix (e.g. 2.1.4); must match apps/v2/package.json version, the actual tag v2-internal-<version> is derived from package.json
        required: true
        type: string
      run_installer_smoke:
        description: Run NSIS installer smoke before publishing
        required: false
        type: boolean
        default: true

# 发布需要写 Release；携带签名 secret，所有第三方 action 一律 pin SHA（H1）。
permissions:
  contents: write

# Round7 M3：同一时间只允许一个 internal release 构建。
concurrency:
  group: v2-internal-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24 runtime, Round7 M4)

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Ensure legacy database
        run: pnpm --filter @dental/v2 ensure:legacy

      - name: Verify
        run: |
          pnpm --filter @dental/v2 run lint
          pnpm --filter @dental/v2 run knip
          pnpm --filter @dental/v2 typecheck
          pnpm --filter @dental/v2 test
          pnpm --filter @dental/v2 test:coverage
          pnpm --filter @dental/v2 test:coverage:web
          pnpm --filter @dental/v2 run test:mutation
          pnpm --filter @dental/v2 run test:quality-score
          pnpm --filter @dental/v2 run audit:security
          pnpm --filter @dental/v2 security:scan
          pnpm --filter @dental/v2 run license:check
          pnpm --filter @dental/v2 build
          pnpm --filter @dental/v2 electron:compile
          # 审计 P2-1：internal 发布此前跳过全套 smoke，门禁强度显著低于
          # public release。补齐自包含 smoke（各自拉起独立 API 进程）。
          pnpm --filter @dental/v2 smoke:http-fuzz
          pnpm --filter @dental/v2 smoke:multi-instance
          pnpm --filter @dental/v2 run smoke:supervisor

      - name: Generate simulated clinic data
        # data/simulated-clinic 被 gitignore：新检出为空，不生成则 permission smoke 静默跳过
        run: pnpm --filter @dental/v2 simulate:clinic-data

      - name: Full smoke suite
        env:
          # T-5：口令按 run 派生（每次运行唯一），备份密钥走 vars，不再硬编码进仓库。
          V2_ADMIN_PASSWORD: v2-internal-admin-${{ github.run_id }}
          V2_BACKUP_KEY: ${{ vars.V2_BACKUP_KEY }}
          V2_SMOKE_USE_EXISTING_DATA: '1'
          V2_DATA_DIR: ${{ runner.temp }}/v2-internal-smoke-data
          # 模拟库缺失时权限冒烟必须失败而非静默跳过
          V2_REQUIRE_PERMISSION_SMOKE: '1'
        run: pnpm --filter @dental/v2 smoke:all

      - name: Build internal installer
        shell: pwsh
        env:
          RUN_INSTALLER_SMOKE: ${{ inputs.run_installer_smoke }}
        run: |
          if ($env:RUN_INSTALLER_SMOKE -ne 'true') {
            powershell -ExecutionPolicy Bypass -File apps/v2/scripts/build-internal-installer.ps1 -SkipInstallerSmoke
          } else {
            powershell -ExecutionPolicy Bypass -File apps/v2/scripts/build-internal-installer.ps1
          }

      - name: Resolve version from package.json
        id: pkg_version
        shell: bash
        run: echo "version=$(node -p "require('./apps/v2/package.json').version")" >> "$GITHUB_OUTPUT"

      # Round7 M12：输入经 env 传递，避免 ${{ }} 直接插值进 shell；先做
      # pattern 校验再与 package.json 比较。
      - name: Validate version input matches package.json
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PKG_VERSION: ${{ steps.pkg_version.outputs.version }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::input version must match ^[0-9]+\.[0-9]+\.[0-9]+$, got '$INPUT_VERSION'"
            exit 1
          fi
          if [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::input version ($INPUT_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      # Round7 M7：内部版 installer 使用 <base>-internal.<UTC时间戳> 命名且
      # package.json 打包后被还原，不能直接用 artifact-name.mjs；取
      # release-v2-internal 下最新生成的 exe（本 job 内唯一产物）。
      - name: Resolve release asset names
        id: assets
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath apps/v2/release-v2-internal -Filter '*.exe' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "No installer produced under apps/v2/release-v2-internal" }
          "installer=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "blockmap=$($exe.Name).blockmap" >> $env:GITHUB_OUTPUT

      - name: Resolve internal version from latest.yml
        id: internal_version
        shell: pwsh
        run: |
          $latest = Get-Content -LiteralPath apps/v2/release-v2-internal/latest.yml -Raw
          if ($latest -match '(?m)^version:\s*(.+)$') {
            $version = $Matches[1].Trim()
          } else {
            throw "latest.yml is missing version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate latest.yml version matches package.json
        shell: pwsh
        env:
          LATEST_VERSION: ${{ steps.internal_version.outputs.version }}
          PKG_VERSION: ${{ steps.pkg_version.outputs.version }}
        run: |
          if ($env:LATEST_VERSION -notlike "$env:PKG_VERSION-internal.*") {
            throw "latest.yml version ($env:LATEST_VERSION) must be $env:PKG_VERSION-internal.*"
          }

      - name: Publish internal release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v2-internal-${{ steps.internal_version.outputs.version }}
          name: Dental Clinic V2 Internal ${{ steps.internal_version.outputs.version }}
          prerelease: true
          files: |
            apps/v2/release-v2-internal/${{ steps.assets.outputs.installer }}
            apps/v2/release-v2-internal/${{ steps.assets.outputs.blockmap }}
            apps/v2/release-v2-internal/latest.yml

      - name: Verify remote internal release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V2_RELEASE_TAG: v2-internal-${{ steps.internal_version.outputs.version }}
        run: pnpm --filter @dental/v2 run verify:remote
