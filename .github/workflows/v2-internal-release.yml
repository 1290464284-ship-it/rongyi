name: V2 Internal Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected version tag suffix (e.g. 2.1.4); must match apps/v2/package.json version, the actual tag v2-internal-<version> is derived from package.json
        required: true
        type: string
      run_installer_smoke:
        description: Run NSIS installer smoke before publishing
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm --filter @dental/v2 typecheck
          pnpm --filter @dental/v2 build
          pnpm --filter @dental/v2 electron:compile

      - name: Build internal installer
        shell: pwsh
        env:
          RUN_INSTALLER_SMOKE: ${{ inputs.run_installer_smoke }}
        run: |
          if ($env:RUN_INSTALLER_SMOKE -ne 'true') {
            powershell -ExecutionPolicy Bypass -File apps/v2/scripts/build-internal-installer.ps1 -SkipInstallerSmoke
          } else {
            powershell -ExecutionPolicy Bypass -File apps/v2/scripts/build-internal-installer.ps1
          }

      - name: Verify update metadata
        run: pnpm --filter @dental/v2 run verify:update

      - name: Resolve version from package.json
        id: pkg_version
        shell: bash
        run: echo "version=$(node -p "require('./apps/v2/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate version input matches package.json
        shell: bash
        run: |
          if [ "${{ inputs.version }}" != "${{ steps.pkg_version.outputs.version }}" ]; then
            echo "::error::input version (${{ inputs.version }}) does not match package.json version (${{ steps.pkg_version.outputs.version }})"
            exit 1
          fi

      - name: Publish internal release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-internal-${{ steps.pkg_version.outputs.version }}
          name: Dental Clinic V2 Internal ${{ steps.pkg_version.outputs.version }}
          prerelease: true
          files: |
            apps/v2/release-v2/*.exe
            apps/v2/release-v2/*.blockmap
            apps/v2/release-v2/latest.yml

      - name: Verify remote internal release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V2_RELEASE_TAG: v2-internal-${{ steps.pkg_version.outputs.version }}
        run: pnpm --filter @dental/v2 run verify:remote
