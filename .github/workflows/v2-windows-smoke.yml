name: V2 Windows Installer Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/v2/**'
      - '.github/workflows/v2-windows-smoke.yml'

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @dental/v2 typecheck

      - name: Unit tests
        run: pnpm --filter @dental/v2 test

      - name: Build and pack installer
        run: pnpm --filter @dental/v2 electron:pack

      - name: Run installer smoke
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File apps/v2/scripts/installer-smoke.ps1
