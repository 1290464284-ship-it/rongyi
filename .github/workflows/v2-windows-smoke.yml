name: V2 Windows Installer Smoke

on:
  workflow_dispatch:
    inputs:
      previous_installer_url:
        description: Optional previous installer URL for upgrade smoke
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'apps/v2/**'
      - '.github/workflows/v2-windows-smoke.yml'

# Round7 H2：本 workflow 只读（不需要写仓库权限）。
permissions:
  contents: read

# Round7 M3：同一 PR 重复 push 时取消进行中的旧 smoke。
concurrency:
  group: v2-windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24 runtime, Round7 M4)

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve Electron cache paths
        shell: pwsh
        run: |
          "ELECTRON_CACHE=$env:LOCALAPPDATA\electron\Cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          "ELECTRON_BUILDER_CACHE=$env:LOCALAPPDATA\electron-builder\Cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      # Round7 M14：缓存 electron-builder 的 Electron / NSIS 下载
      # （%LOCALAPPDATA%\electron\Cache 与 %LOCALAPPDATA%\electron-builder\Cache），
      # 降低每个 PR 全量 electron:dist 的成本；仍做完整 NSIS 安装验证，smoke
      # 有效性不变。继续保留 PR 触发：本 job 是 required check（Round7 H3）。
      - name: Cache Electron binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @dental/v2 typecheck

      - name: Build and pack installer
        run: pnpm --filter @dental/v2 electron:dist

      - name: Resolve current installer
        id: current-installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath apps/v2/release-v2 -Filter "*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "No installer produced by electron:dist" }
          "path=$exe" >> $env:GITHUB_OUTPUT

      - name: Run installer smoke
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File apps/v2/scripts/installer-smoke.ps1

      - name: Verify package
        env:
          V2_SKIP_PUBLISHER_NAME_CHECK: '1'
        run: pnpm --filter @dental/v2 run verify:package

      - name: Packaged UI smoke
        env:
          # T-5：口令按 run 派生，备份密钥走 vars，不再硬编码进仓库。
          V2_ADMIN_PASSWORD: v2-packaged-admin-${{ github.run_id }}
          V2_BACKUP_KEY: ${{ vars.V2_BACKUP_KEY }}
        run: pnpm --filter @dental/v2 smoke:packaged-ui

      - name: Download previous installer for upgrade smoke
        if: github.event_name == 'workflow_dispatch' && inputs.previous_installer_url != ''
        id: previous-installer
        shell: pwsh
        env:
          PREVIOUS_URL: ${{ inputs.previous_installer_url }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'v2-previous'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $dest = Join-Path $dir 'previous-setup.exe'
          Invoke-WebRequest -Uri $env:PREVIOUS_URL -OutFile $dest
          "path=$dest" >> $env:GITHUB_OUTPUT

      - name: Run upgrade smoke
        if: github.event_name == 'workflow_dispatch' && steps.previous-installer.outputs.path != ''
        shell: pwsh
        env:
          V2_PREVIOUS_INSTALLER: ${{ steps.previous-installer.outputs.path }}
          V2_CURRENT_INSTALLER: ${{ steps.current-installer.outputs.path }}
          V2_ADMIN_PASSWORD: v2-upgrade-admin-${{ github.run_id }}
        run: |
          powershell -ExecutionPolicy Bypass -File apps/v2/scripts/upgrade-smoke.ps1 `
            -CurrentInstallerPath $env:V2_CURRENT_INSTALLER `
            -PreviousInstallerPath $env:V2_PREVIOUS_INSTALLER
