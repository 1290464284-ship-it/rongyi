name: Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Create API deployment package
        run: |
          mkdir -p deploy/api
          cp -r apps/api/dist deploy/api/
          cp apps/api/package.json deploy/api/
          cp apps/api/.env.example deploy/api/.env.example
          echo "Deployment package created"

      - name: Create Web deployment package
        run: |
          mkdir -p deploy/web
          cp -r apps/web/dist deploy/web/
          echo "Web build package created"

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-deploy-package
          path: deploy/api/
          retention-days: 30

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-deploy-package
          path: deploy/web/
          retention-days: 30

      - name: Create release notes
        run: |
          cat > deploy/release-notes.md << 'EOF'
          # 发布说明

          **版本**: ${{ github.sha }}
          **发布时间**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **分支**: ${{ github.ref_name }}

          ## 变更内容

          - 自动化构建产物
          - 包含 API 和 Web 应用

          ## 部署说明

          详见 docs/deployment/docker-deployment.md
          EOF

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: deploy/release-notes.md
          retention-days: 30
