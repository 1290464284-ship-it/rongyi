name: V2 CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v2-*'
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'apps/v2/**'
      - 'docs/architecture/**'
      - 'docs/release/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'apps/v2/**'
      - 'docs/architecture/**'
      - 'docs/release/**'
      - '.github/workflows/v2-ci.yml'

# Round7 H2：CI 只读，不需要写权限。
permissions:
  contents: read

# Round7 M3：同一分支连续 push 时取消进行中的旧 CI，避免并行浪费 Actions 分钟。
concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

# Round7 M13 修订（round 42 环境隔离审计）：CI 专用备份密钥与管理员口令
# 只挂到 smoke job——verify job 的 vitest/mutation/quality-score 步骤必须
# 在无 V2_* env 的封闭环境运行（测试套件已封闭化，但根源上不注入更稳）。

jobs:
  # 审计 P2-4：原单 job 40+ 步骤挤在 40min 上限内，任一步超时即整体失败。
  # 拆为 verify（静态/单测/覆盖率/变异/构建）与 smoke（dev server + 全套
  # smoke + drills）两个 job，分别限时、失败可局部重跑。
  verify:
    name: Static Checks, Tests, Coverage & Build
    runs-on: ubuntu-latest
    # 含 13 分钟的变异测试（扩面后），预留余量。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24 runtime, Round7 M4)

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate legacy schema SQL
        run: |
          pnpm --filter @dental/v2 run generate:legacy-schema
          git diff --exit-code -- apps/v2/legacy/schema/legacy-schema.generated.sql

      - name: Typecheck
        run: pnpm --filter @dental/v2 typecheck

      - name: Lint
        run: pnpm --filter @dental/v2 run lint

      - name: Knip
        run: pnpm --filter @dental/v2 run knip

      - name: Unit tests
        run: pnpm --filter @dental/v2 test

      - name: Full shuffle tests
        run: pnpm --filter @dental/v2 run test:flaky
        env:
          # 至少两轮 shuffle，检出间歇性顺序泄漏（单轮漏检率高）。
          FLAKY_RUNS: 2

      - name: Mutation
        run: pnpm --filter @dental/v2 run test:mutation

      - name: Flaky report
        run: pnpm --filter @dental/v2 run test:flaky:report

      - name: Coverage
        run: pnpm --filter @dental/v2 test:coverage

      - name: Web coverage
        run: pnpm --filter @dental/v2 test:coverage:web

      - name: Quality score
        run: pnpm --filter @dental/v2 run test:quality-score

      - name: v8 ignore ratchet
        run: pnpm --filter @dental/v2 run v8-ignore:report

      - name: Upload quality score artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-score
          path: apps/v2/quality-score.json
          if-no-files-found: error

      - name: Audit
        run: pnpm --filter @dental/v2 run audit:security

      - name: Security scan
        run: pnpm --filter @dental/v2 security:scan

      - name: License scan
        run: pnpm --filter @dental/v2 run license:check

      - name: SBOM
        run: pnpm --filter @dental/v2 run sbom

      - name: Build
        run: pnpm --filter @dental/v2 build

      - name: Electron compile
        run: pnpm --filter @dental/v2 electron:compile

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-verify-artifacts
          if-no-files-found: ignore
          path: |
            apps/v2/coverage
            apps/v2/coverage-web

  smoke:
    name: Smoke Suites & Drills
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # dev server 引导 admin + 备份加密需要；仅本 job（脚本类 smoke）使用，
      # 不注入 verify job 的测试进程。
      V2_BACKUP_KEY: ${{ vars.V2_BACKUP_KEY }}
      V2_ADMIN_PASSWORD: v2-ci-admin-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile electron server bundle
        # smoke 与全部 drills 都各自以 dist-electron/server.cjs 拉起独立 API
        # 进程；smoke job 跑在独立 runner（fresh checkout）上，verify job 的
        # electron:compile 产物不会带过来，必须在本 job 自行编译。
        run: pnpm --filter @dental/v2 electron:compile

      - name: Install Playwright
        run: pnpm --filter @dental/v2 exec playwright install --with-deps chromium

      - name: Start dev servers
        run: pnpm --filter @dental/v2 dev > /tmp/v2-dev.log 2>&1 &

      - name: Wait for services
        run: node apps/v2/scripts/wait-for-services.mjs

      - name: API smoke
        run: pnpm --filter @dental/v2 smoke:api

      - name: UI smoke
        run: pnpm --filter @dental/v2 smoke:ui

      - name: Load smoke
        run: pnpm --filter @dental/v2 test:load

      - name: Performance history
        run: pnpm --filter @dental/v2 run test:performance-history

      - name: HTTP fuzz smoke
        run: pnpm --filter @dental/v2 smoke:http-fuzz

      - name: Multi-instance smoke
        run: pnpm --filter @dental/v2 smoke:multi-instance

      # Round7 H5：数据完整性验证进入 CI 门禁。此时 dev 库已有 smoke 产生的
      # 数据，可真实覆盖外键孤儿 / 完整性 / 备份恢复全链路（delivery-drill
      # 使用独立临时数据目录与自启 server，不干扰上面的 dev server）。
      - name: Verify database integrity
        run: pnpm --filter @dental/v2 verify:database

      - name: Verify foreign keys
        run: pnpm --filter @dental/v2 verify:foreign-keys

      - name: Ensure sanitized legacy database
        run: pnpm --filter @dental/v2 ensure:legacy

      - name: Verify legacy resource generator output
        run: |
          pnpm --filter @dental/v2 run generate:legacy-resources
          git diff --exit-code -- apps/v2/src/domain/legacy-resources.generated.ts

      - name: Simulate clinic data
        run: pnpm --filter @dental/v2 simulate:clinic-data

      - name: Permission smoke
        env:
          # 防假绿：模拟库缺失时必须失败，不允许静默跳过。
          V2_REQUIRE_PERMISSION_SMOKE: '1'
        run: pnpm --filter @dental/v2 smoke:permissions

      - name: Disaster drill
        run: pnpm --filter @dental/v2 disaster:drill

      - name: Crash recovery drill
        run: pnpm --filter @dental/v2 drill:crash

      - name: Legacy dirty database drill
        run: pnpm --filter @dental/v2 drill:legacy-dirty

      - name: Environment failure drill
        run: pnpm --filter @dental/v2 drill:environment

      - name: Corrupt boot drill
        run: pnpm --filter @dental/v2 drill:corrupt-boot

      - name: Delivery drill
        run: pnpm --filter @dental/v2 delivery:drill

      - name: Dump dev server logs on failure
        if: failure()
        run: |
          if [ -f /tmp/v2-dev.log ]; then
            echo "===== v2-dev.log (tail 200) ====="
            tail -n 200 /tmp/v2-dev.log || true
            echo "===== v2-dev.log (lines) ====="
            wc -l /tmp/v2-dev.log || true
          else
            echo "No /tmp/v2-dev.log found"
          fi

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-smoke-artifacts
          if-no-files-found: ignore
          path: |
            apps/v2/reports/load-smoke.json
            /tmp/v2-dev.log
