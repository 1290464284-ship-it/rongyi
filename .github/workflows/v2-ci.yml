name: V2 CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v2-*'
    paths:
      - 'apps/v2/**'
      - 'docs/refactor-v2-*'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    paths:
      - 'apps/v2/**'
      - 'docs/refactor-v2-*'
      - '.github/workflows/v2-ci.yml'

# CI 专用环境变量（非生产密钥）：加密备份必需 V2_BACKUP_KEY，
# 否则 POST /backups 在无 key 且非 test 环境时返回 500，导致 API smoke 失败。
env:
  V2_BACKUP_KEY: ci-backup-key-0123456789abcdef

jobs:
  verify:
    name: Lint, Build, Type Check, Test & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @dental/v2 typecheck

      - name: Lint
        run: pnpm --filter @dental/v2 run lint

      - name: Knip
        run: pnpm --filter @dental/v2 run knip

      - name: Unit tests
        run: pnpm --filter @dental/v2 test

      - name: Coverage
        run: pnpm --filter @dental/v2 test:coverage

      - name: Web coverage
        run: pnpm --filter @dental/v2 test:coverage:web

      - name: Audit
        run: pnpm --filter @dental/v2 run audit:security

      - name: Security scan
        run: pnpm --filter @dental/v2 security:scan

      - name: License scan
        run: pnpm --filter @dental/v2 run license:check

      - name: Build
        run: pnpm --filter @dental/v2 build

      - name: Electron compile
        run: pnpm --filter @dental/v2 electron:compile

      - name: Install Playwright
        run: pnpm --filter @dental/v2 exec playwright install --with-deps chromium

      - name: Start dev servers
        run: pnpm --filter @dental/v2 dev > /tmp/v2-dev.log 2>&1 &

      - name: Wait for services
        run: node apps/v2/scripts/wait-for-services.mjs

      - name: API smoke
        run: pnpm --filter @dental/v2 smoke:api

      - name: UI smoke
        run: pnpm --filter @dental/v2 smoke:ui

      - name: Load smoke
        run: pnpm --filter @dental/v2 test:load

      - name: Load benchmark
        run: pnpm --filter @dental/v2 benchmark:load

      - name: Dump dev server logs on failure
        if: failure()
        run: |
          if [ -f /tmp/v2-dev.log ]; then
            echo "===== v2-dev.log (tail 200) ====="
            tail -n 200 /tmp/v2-dev.log || true
            echo "===== v2-dev.log (lines) ====="
            wc -l /tmp/v2-dev.log || true
          else
            echo "No /tmp/v2-dev.log found"
          fi
