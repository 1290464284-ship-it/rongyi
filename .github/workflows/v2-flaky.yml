name: V2 Flaky Test Sweep

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: read

concurrency:
  group: v2-flaky-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: Shuffled Unit Test Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # B-1.4 首跑修复：large-db-concurrency-smoke 直接以
      # dist-electron/server.cjs 拉起 API，本 workflow 之前没有编译步骤，
      # 首跑因文件缺失失败。
      - name: Compile electron server bundle
        run: pnpm --filter @dental/v2 electron:compile

      - name: Run shuffled tests twice without retries
        run: pnpm --filter @dental/v2 run test:flaky
        env:
          FLAKY_RUNS: 2

      - name: Large DB concurrency smoke
        run: pnpm --filter @dental/v2 run test:large-db-concurrency
        env:
          V2_SIM_SCALE: large
