name: V2 Soak Smoke

# B-3.1：每周一次的 1 小时 API soak（GitHub-hosted runner 无法承载 24h
# 长跑，季度长跑保留为受控机器上的手工任务，见 OPS.md）。除了请求 p95
# 与数据库完整性，还按 B-3.3 采样内存/活动句柄增长并设上限。
on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Soak duration in seconds
        required: false
        type: string
        default: '3600'
  schedule:
    - cron: '30 4 * * 0' # 每周日 04:30 UTC

permissions:
  contents: read

concurrency:
  group: v2-soak
  cancel-in-progress: true

jobs:
  soak:
    name: Hourly API Soak
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24 runtime)

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile electron server bundle
        run: pnpm --filter @dental/v2 electron:compile

      - name: Run hourly soak
        env:
          V2_SOAK_SECONDS: ${{ inputs.duration_seconds || '3600' }}
          V2_SOAK_RPS: '2'
          V2_SOAK_P95_LIMIT_MS: '2500'
          V2_SOAK_SAMPLE_MS: '30000'
          V2_SOAK_MAX_HEAP_GROWTH_BYTES: '67108864'   # 64 MiB
          V2_SOAK_MAX_RSS_GROWTH_BYTES: '134217728'   # 128 MiB
          V2_SOAK_MAX_RESOURCE_GROWTH: '20'
        run: pnpm --filter @dental/v2 soak:smoke
