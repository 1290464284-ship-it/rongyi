name: V2 Release

# 内部渠道为主（v2-internal-release）：不购买代码签名证书，公开发布链
# 降级为保险丝——仅按需手动触发（workflow_dispatch），避免 tag 误触导致
# 失败噪音。触发前需人工确认：CSC 签名证书 + V2_EXPECTED_CERT_THUMBPRINT
# 均已配置，且发布内容经内部渠道验证通过。
on:
  workflow_dispatch:

# 发布需要写 Release（contents: write）。注意：本 workflow 携带
# CSC_LINK / CSC_KEY_PASSWORD 签名证书 secrets，所有第三方 action 一律
# pin 40 位 commit SHA（Round7 H1），防 tag 被上游改写导致供应链 RCE。
permissions:
  contents: write

# Round7 M3：同一时间只允许一个 release 构建，避免 latest.yml / 资产互相覆盖。
concurrency:
  group: v2-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # Round7 M1：production environment 必须配置 required reviewers 才能算
    # 受保护发布。GitHub 设置层面（Settings > Environments > production）
    # 需人工配置 reviewers + 部署保护；未配置前 tag push 即直接发布
    # （默认行为），发布前应人工核对 tag 与 release 内容。
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24 runtime, Round7 M4)

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Round7 C2：tag 与 package.json 版本一致性门禁（internal-release 已有，
      # 正式 release 补齐），避免 2.2.0 式版本漂移再次发生。
      - name: Validate tag matches package.json version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./apps/v2/package.json').version")
          if [ "$RELEASE_TAG" != "v2-$PKG_VERSION" ]; then
            echo "::error::tag $RELEASE_TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Verify
        run: |
          # 正式发布不能只依赖并发运行的 v2-ci（tag push 可能先到 release），
          # 核心门禁必须在发布 job 内同步执行。
          pnpm --filter @dental/v2 run lint
          pnpm --filter @dental/v2 run knip
          pnpm --filter @dental/v2 typecheck
          pnpm --filter @dental/v2 test
          pnpm --filter @dental/v2 test:coverage
          pnpm --filter @dental/v2 test:coverage:web
          pnpm --filter @dental/v2 run test:mutation
          pnpm --filter @dental/v2 run test:quality-score
          pnpm --filter @dental/v2 run audit:security
          pnpm --filter @dental/v2 security:scan
          pnpm --filter @dental/v2 run license:check
          pnpm --filter @dental/v2 build
          pnpm --filter @dental/v2 electron:compile
          # 自包含 smoke（各自拉起独立 API 进程），不依赖 v2-ci 并行结果。
          pnpm --filter @dental/v2 smoke:http-fuzz
          pnpm --filter @dental/v2 smoke:multi-instance

      - name: Generate simulated clinic data
        # data/simulated-clinic 被 gitignore：新检出为空，不生成则 permission smoke 静默跳过
        run: pnpm --filter @dental/v2 simulate:clinic-data

      - name: Full smoke suite
        env:
          V2_ADMIN_PASSWORD: v2-release-smoke-admin
          V2_BACKUP_KEY: v2-release-smoke-backup
          V2_SMOKE_USE_EXISTING_DATA: '1'
          V2_DATA_DIR: ${{ runner.temp }}/v2-release-smoke-data
          # 模拟库缺失时权限冒烟必须失败而非静默跳过
          V2_REQUIRE_PERMISSION_SMOKE: '1'
        run: pnpm --filter @dental/v2 smoke:all

      - name: Verify smoke database
        env:
          V2_DATA_DIR: ${{ runner.temp }}/v2-release-smoke-data
        run: |
          pnpm --filter @dental/v2 verify:database
          pnpm --filter @dental/v2 verify:foreign-keys

      - name: Require signing secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Write-Error "CSC_LINK secret is not configured"
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            Write-Error "CSC_KEY_PASSWORD secret is not configured"
          }
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Require expected certificate thumbprint
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:V2_EXPECTED_CERT_THUMBPRINT)) {
            Write-Error "V2_EXPECTED_CERT_THUMBPRINT variable is not configured; public releases must pin the signing certificate"
          }
        env:
          V2_EXPECTED_CERT_THUMBPRINT: ${{ vars.V2_EXPECTED_CERT_THUMBPRINT }}

      - name: Inject publisher name from signing certificate
        shell: pwsh
        run: |
          & "apps/v2/scripts/inject-publisher-name.ps1" `
            -PackageJson "apps/v2/package.json" `
            -CertificatePath $env:CSC_LINK `
            -CertificatePassword $env:CSC_KEY_PASSWORD
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @dental/v2 electron:dist

      - name: Exclude internal signing certificate from the public package
        # 内部版打包脚本（build-internal-installer.ps1）会临时生成/复制该证书；
        # 公开版不允许打包自签名内部证书（verify:package 会拒绝），
        # 且运行时无任何代码引用它，打包前移除即可（此证书为公开密钥 .cer，无泄密风险）。
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "apps/v2/build/internal-signing.pfx.cer" -Force
          if (Test-Path -LiteralPath "apps/v2/build/internal-signing.pfx.cer") {
            Write-Error "internal signing certificate removal failed"
          }

      - name: Verify package
        run: pnpm --filter @dental/v2 run verify:package

      - name: Verify trusted signature
        env:
          # Round7 M5：白名单优先——把正式签名证书指纹配置到仓库
          # Settings > Variables > V2_EXPECTED_CERT_THUMBPRINT；未配置时
          # 脚本退化为信任链校验（非自签名 + X509 链构建 + 有效期）。
          V2_EXPECTED_CERT_THUMBPRINT: ${{ vars.V2_EXPECTED_CERT_THUMBPRINT }}
        run: pnpm --filter @dental/v2 run verify:signature

      - name: Installer smoke
        run: pnpm --filter @dental/v2 run installer:smoke

      - name: Packaged UI smoke
        run: pnpm --filter @dental/v2 smoke:packaged-ui

      - name: Upgrade smoke
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V2_RELEASE_TAG: ${{ github.ref_name }}
          V2_ADMIN_PASSWORD: ${{ vars.V2_UPGRADE_ADMIN_PASSWORD }}
        run: |
          # Round7 H9：显式 --limit 200 + semver 排序，避免默认 30 条分页与
          # 隐式创建时间排序导致 previous 找错/找不到；skip 时输出
          # ::warning:: 便于审计，而不是静默 exit 0。
          $releases = @(gh release list --limit 200 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -match '^v2-\d+\.\d+\.\d+$' } |
            Sort-Object { [version](($_ -replace '^v2-', '')) } -Descending)
          $current = $env:V2_RELEASE_TAG
          $currentVersion = [version]($current -replace '^v2-', '')
          $previous = $releases | Where-Object { [version]($_ -replace '^v2-', '') -lt $currentVersion } | Select-Object -First 1
          if (-not $previous) {
            Write-Host "::warning::No previous release available; skipping upgrade smoke (current=$current, releases=$($releases.Count))"
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP 'v2-upgrade'
          if (Test-Path -LiteralPath $dir) {
            [System.IO.Directory]::Delete($dir, $true)
          }
          New-Item -ItemType Directory -Path $dir | Out-Null
          gh release download $previous --pattern '*.exe' --dir $dir
          $previousExe = Get-ChildItem -LiteralPath $dir -Filter '*.exe' |
            Select-Object -First 1 -ExpandProperty FullName
          # Round7 M7：用 artifact-name.mjs 精确计算当前 installer 文件名，
          # 不依赖通配符（release-v2 中可能残留旧 exe）。
          $currentExe = Join-Path $PWD ("apps/v2/release-v2/" + (node apps/v2/scripts/artifact-name.mjs))
          powershell -ExecutionPolicy Bypass -File apps/v2/scripts/upgrade-smoke.ps1 `
            -CurrentInstallerPath $currentExe `
            -PreviousInstallerPath $previousExe

      - name: Generate and verify update metadata
        run: |
          pnpm --filter @dental/v2 run update:metadata
          pnpm --filter @dental/v2 run verify:update

      # Round7 M7：解析精确资产名（替代 *.exe 通配符）。
      - name: Resolve release asset names
        id: assets
        shell: bash
        run: |
          INSTALLER=$(node apps/v2/scripts/artifact-name.mjs)
          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"
          echo "blockmap=$INSTALLER.blockmap" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            apps/v2/release-v2/${{ steps.assets.outputs.installer }}
            apps/v2/release-v2/${{ steps.assets.outputs.blockmap }}
            apps/v2/release-v2/latest.yml

      - name: Verify remote release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V2_RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm --filter @dental/v2 run verify:remote
