name: V2 Release

on:
  push:
    tags:
      - 'v2-*'

permissions:
  contents: write

defaults:
  run:
    working-directory: source

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Verify
        run: |
          pnpm --filter @dental/v2 typecheck
          pnpm --filter @dental/v2 test
          pnpm --filter @dental/v2 build
          pnpm --filter @dental/v2 electron:compile

      - name: Require signing secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Write-Error "CSC_LINK secret is not configured"
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            Write-Error "CSC_KEY_PASSWORD secret is not configured"
          }
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @dental/v2 electron:dist

      - name: Verify package
        run: pnpm --filter @dental/v2 run verify:package

      - name: Generate and verify update metadata
        run: |
          pnpm --filter @dental/v2 run update:metadata
          pnpm --filter @dental/v2 run verify:update

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            source/apps/v2/release-v2/*.exe
            source/apps/v2/release-v2/*.blockmap
            source/apps/v2/release-v2/latest.yml
