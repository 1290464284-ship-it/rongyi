name: V2 Release

on:
  push:
    tags:
      - 'v2-[0-9]*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm --filter @dental/v2 typecheck
          pnpm --filter @dental/v2 build
          pnpm --filter @dental/v2 electron:compile

      - name: Require signing secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Write-Error "CSC_LINK secret is not configured"
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            Write-Error "CSC_KEY_PASSWORD secret is not configured"
          }
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @dental/v2 electron:dist

      - name: Verify package
        run: pnpm --filter @dental/v2 run verify:package

      - name: Verify trusted signature
        run: pnpm --filter @dental/v2 run verify:signature

      - name: Installer smoke
        run: pnpm --filter @dental/v2 run installer:smoke

      - name: Upgrade smoke
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V2_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releases = @(gh release list --json tagName --jq '.[].tagName' |
            Where-Object { $_ -match '^v2-\d+\.\d+\.\d+$' })
          $current = $env:V2_RELEASE_TAG
          $index = [array]::IndexOf($releases, $current)
          if ($index -lt 0 -or $index -ge $releases.Count - 1) {
            Write-Host "No previous release available; skipping upgrade smoke"
            exit 0
          }
          $previous = $releases[$index + 1]
          $dir = Join-Path $env:RUNNER_TEMP 'v2-upgrade'
          if (Test-Path -LiteralPath $dir) {
            [System.IO.Directory]::Delete($dir, $true)
          }
          New-Item -ItemType Directory -Path $dir | Out-Null
          gh release download $previous --pattern '*.exe' --dir $dir
          $previousExe = Get-ChildItem -LiteralPath $dir -Filter '*.exe' |
            Select-Object -First 1 -ExpandProperty FullName
          $currentExe = Get-ChildItem -LiteralPath apps/v2/release-v2 -Filter '*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          powershell -ExecutionPolicy Bypass -File apps/v2/scripts/upgrade-smoke.ps1 `
            -CurrentInstallerPath $currentExe `
            -PreviousInstallerPath $previousExe

      - name: Generate and verify update metadata
        run: |
          pnpm --filter @dental/v2 run update:metadata
          pnpm --filter @dental/v2 run verify:update

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/v2/release-v2/*.exe
            apps/v2/release-v2/*.blockmap
            apps/v2/release-v2/latest.yml

      - name: Verify remote release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V2_RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm --filter @dental/v2 run verify:remote
